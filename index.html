<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Kurir Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3F1FF;--paper:#FFFFFF;--ink:#1B2160;--soft:#4B5390;--line:#BFD3F0;--edge:#1B2160;
  --sun:#FFC22E;--on-sun:#1B2160;--coral:#FF5E7A;--coral-bg:#FFE1E7;--mint:#0FA67A;--mint-bg:#D6F6EA;
  --violet:#6C4CFF;--violet-bg:#E8E3FF;--focus:#6C4CFF;
  --a:#1E8FFF;--a-bg:#DCEEFF;--b:#6C4CFF;--b-bg:#E8E3FF;--c:#FFC22E;--c-bg:#FFF0C2;--d:#FF5E7A;--d-bg:#FFE1E7;--e:#12B886;--e-bg:#D6F6EA;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1340;--paper:#192060;--ink:#EDF0FF;--soft:#B5BEF0;--line:#2F3A8C;--edge:#7F8DF0;
    --coral-bg:#4D1F31;--mint:#2FD6A3;--mint-bg:#0F4B3C;--violet-bg:#2B2670;--focus:#FFD84D;
    --a-bg:#16306B;--b-bg:#2B2670;--c-bg:#4A3B10;--d-bg:#4D1F31;--e-bg:#0F4B3C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1340;--paper:#192060;--ink:#EDF0FF;--soft:#B5BEF0;--line:#2F3A8C;--edge:#7F8DF0;
  --coral-bg:#4D1F31;--mint:#2FD6A3;--mint-bg:#0F4B3C;--violet-bg:#2B2670;--focus:#FFD84D;
  --a-bg:#16306B;--b-bg:#2B2670;--c-bg:#4A3B10;--d-bg:#4D1F31;--e-bg:#0F4B3C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:100%}
html.big{font-size:118%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.4px,transparent 1.4px);background-size:28px 28px;color:var(--ink);font:400 1.0625rem/1.55 Nunito,"Trebuchet MS",system-ui,sans-serif;min-height:100%}
h1,h2,h3,h4{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;line-height:1.12;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,6.5vw,3.6rem)}h2{font-size:clamp(1.5rem,4vw,2.1rem)}h3{font-size:1.25rem}
p{margin:0 0 .8em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--soft)}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 70px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--paper);border-bottom:3px solid var(--edge)}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.15rem}
.piko{width:38px;height:38px;flex:none}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:2.5px solid var(--edge);border-radius:99px;background:var(--bg);font-weight:800;font-size:.95rem;white-space:nowrap}
.pill.xp{background:var(--sun);color:var(--on-sun)}
.tools{display:flex;gap:6px}
.ib{min-width:44px;min-height:44px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper);font-weight:800;padding:0 10px}
.ib:hover{background:var(--bg)}
@media(max-width:620px){.brand span{display:none}.stats{margin-left:0}.pill{font-size:.85rem;padding:3px 9px}}

/* primitives */
.card{background:var(--paper);border:2.5px solid var(--edge);border-radius:22px;box-shadow:0 5px 0 var(--edge);padding:20px}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 22px;border:2.5px solid var(--edge);border-radius:99px;background:var(--sun);color:var(--on-sun);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.1rem;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.mint{background:var(--mint);color:#fff}
.btn.sm{min-height:40px;padding:4px 16px;font-size:.98rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:2px 11px;border:2px solid var(--edge);border-radius:99px;font-size:.84rem;font-weight:800;background:var(--paper)}
.fb{min-height:1.5em;margin:10px 0 0;padding:0;font-weight:600}
.fb.good{color:var(--mint)}.fb.bad{color:var(--coral)}
.fb.good,.fb.bad{padding:10px 14px;border-radius:14px;border:2px solid currentColor;background:var(--paper)}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* welcome */
.hero{display:grid;gap:22px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1 span{display:block}
.kicker{display:inline-block;margin-bottom:10px}
.track{position:relative;height:150px;border:2.5px solid var(--edge);border-radius:18px;background:var(--a-bg);overflow:hidden;margin-bottom:12px}
.track .end{position:absolute;top:50%;transform:translateY(-50%);font-size:2.6rem}
.track .l{left:14px}.track .r{right:14px}
.track .cable{position:absolute;left:62px;right:62px;top:50%;border-top:4px dashed var(--edge)}
.track .runner{position:absolute;top:50%;margin-top:-30px;left:76px;width:60px;height:60px;transition:left 1.5s ease-in-out}
.track .runner .piko{width:60px;height:60px}
.track .runner.back .piko{transform:scaleX(-1)}
.cap{min-height:3em;font-weight:700}
.jalur{display:grid;gap:10px;margin:14px 0}
@media(min-width:600px){.jalur{grid-template-columns:repeat(3,1fr)}}
.jb{text-align:left;padding:12px 14px;border:2.5px solid var(--edge);border-radius:18px;background:var(--paper)}
.jb b{display:block;font-family:"Baloo 2",sans-serif;font-size:1.1rem}
.jb small{color:var(--soft);font-size:.88rem;line-height:1.3;display:block}
.jb[aria-pressed="true"]{background:var(--sun);color:var(--on-sun);box-shadow:0 4px 0 var(--edge)}
.jb[aria-pressed="true"] small{color:var(--on-sun)}
input[type=text],textarea{width:100%;padding:10px 14px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper);color:var(--ink);font:inherit}
label.lb{display:block;font-weight:800;margin:10px 0 4px}

/* guide */
.tp-grid{display:grid;gap:12px;margin:16px 0}
@media(min-width:640px){.tp-grid{grid-template-columns:1fr 1fr}}
.tp{display:flex;gap:12px;padding:12px 14px;border:2.5px solid var(--edge);border-radius:18px;background:var(--paper)}
.tp .ic{font-size:1.9rem;flex:none}
.tp.ok{background:var(--mint-bg)}
.drill{display:grid;gap:12px;margin:14px 0}
@media(min-width:760px){.drill{grid-template-columns:repeat(3,1fr)}}
.drill .card{padding:14px}
.basket{margin-top:8px;min-height:64px;border:3px dashed var(--edge);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;background:var(--bg);width:100%}
.basket.over{background:var(--sun)}

/* map */
.mapgrid{display:grid;gap:16px}
@media(min-width:900px){.mapgrid{grid-template-columns:1.5fr 1fr;align-items:start}}
.lvlbar{height:18px;border:2.5px solid var(--edge);border-radius:99px;background:var(--bg);overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--sun);transition:width .6s}
.cable-list{position:relative;list-style:none;margin:0;padding:0 0 0 38px}
.cable-list::before{content:"";position:absolute;left:15px;top:20px;bottom:20px;border-left:5px dotted var(--edge)}
.stn{position:relative;margin-bottom:16px}
.stn .node{position:absolute;left:-38px;top:18px;width:32px;height:32px;border-radius:50%;border:3px solid var(--edge);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:.9rem;z-index:1}
.stn.done .node{background:var(--mint);color:#fff}
.stn .piko-here{position:absolute;left:-52px;top:-14px;width:46px;height:46px;z-index:2;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.stbtn{width:100%;text-align:left;border:2.5px solid var(--edge);border-radius:20px;padding:14px 16px;background:var(--st-bg);box-shadow:0 5px 0 var(--edge);display:flex;gap:14px;align-items:center}
.stbtn:hover{filter:brightness(1.03)}
.stbtn .big{font-size:2.2rem;flex:none}
.stbtn h3{margin:0}
.stbtn small{display:block;color:var(--soft);font-weight:600}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--edge);background:var(--paper)}
.dots i.on{background:var(--mint)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bdg{text-align:center;font-size:.72rem;font-weight:800;line-height:1.15}
.bdg .bi{display:grid;place-items:center;width:100%;aspect-ratio:1;font-size:1.7rem;border:2.5px solid var(--edge);border-radius:50%;background:var(--sun);margin-bottom:4px}
.bdg.lock .bi{background:var(--bg);filter:grayscale(1);opacity:.5}
.tp-list{list-style:none;margin:0;padding:0}
.tp-list li{display:flex;gap:8px;padding:4px 0;font-size:.95rem}
.tp-list li b{flex:none}

/* station */
.sthead{background:var(--st-bg);border:2.5px solid var(--edge);border-radius:22px;padding:14px 18px;display:flex;gap:14px;align-items:center;margin-bottom:14px;box-shadow:0 5px 0 var(--edge)}
.sthead .big{font-size:2.6rem}
.sthead h2{margin:0}
.dpl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stp{padding:5px 12px;border:2.5px solid var(--edge);border-radius:99px;background:var(--paper);font-weight:800;font-size:.86rem}
.stp.done{background:var(--mint-bg)}
.stp.cur{background:var(--st);color:#fff;color:var(--on-st,#fff)}
.stp[disabled]{opacity:.45;cursor:not-allowed}
.bubble{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.bubble .piko{width:54px;height:54px}
.bubble .say{position:relative;flex:1;padding:10px 14px;border:2.5px solid var(--edge);border-radius:18px;background:var(--bg);font-weight:700}
.bubble .say::before{content:"";position:absolute;left:-10px;top:18px;width:16px;height:16px;background:var(--bg);border-left:2.5px solid var(--edge);border-bottom:2.5px solid var(--edge);transform:rotate(45deg)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.scene{font-size:3rem;text-align:center;padding:10px;border-radius:18px;background:var(--st-bg);border:2.5px solid var(--edge);margin-bottom:12px}
.hintbox{margin-top:12px;padding:10px 14px;border:2.5px dashed var(--edge);border-radius:14px;background:var(--c-bg)}

/* options */
.qblock{margin:0 0 20px}
.qblock>.qt{font-weight:800;margin-bottom:8px}
.ctx{padding:12px 14px;border:2.5px solid var(--edge);border-radius:16px;background:var(--bg);margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 14px;border:2.5px solid var(--edge);border-radius:16px;background:var(--paper);min-height:48px}
.opt:hover:not([disabled]){background:var(--c-bg)}
.opt .ol{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--edge);font-weight:800;font-size:.85rem;background:var(--bg)}
.opt.right{background:var(--mint-bg);border-color:var(--mint)}
.opt.wrong{background:var(--coral-bg);border-color:var(--coral)}
.opt[disabled]{cursor:default}
.opts.two{grid-template-columns:1fr 1fr}

/* hotspots */
.hs{display:grid;gap:10px;margin:12px 0}
.hs.grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.hs.row{grid-template-columns:1fr;align-items:center}
@media(min-width:760px){.hs.row{grid-template-columns:repeat(5,1fr)}.hs.row .arrow{display:none}}
.hs-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border:2.5px solid var(--edge);border-radius:18px;background:var(--paper);font-weight:800;position:relative}
.hs-btn .hs-ic{font-size:2.1rem}
.hs-btn.seen::after{content:"✓";position:absolute;top:6px;right:8px;color:var(--mint);font-weight:800}
.hs-btn[aria-pressed="true"]{background:var(--st-bg);box-shadow:0 4px 0 var(--edge)}
.arrow{display:none}
.prog{font-weight:800;color:var(--soft);margin:4px 0}
.detail{padding:14px 16px;border:2.5px solid var(--edge);border-radius:18px;background:var(--bg);min-height:120px}
.analogy{padding:8px 12px;border-radius:12px;background:var(--c-bg)}
.fmt{display:inline-block;margin-right:4px}

/* order / match / sort */
.slots{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:48px;padding:6px 12px;border:2.5px dashed var(--edge);border-radius:14px;color:var(--soft)}
.slot .sn{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--st);color:var(--on-st,#fff);font-weight:800}
.slot.filled{border-style:solid;background:var(--mint-bg);color:var(--ink);font-weight:700}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cs{padding:9px 14px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper);box-shadow:0 3px 0 var(--edge);text-align:left;font-weight:700;cursor:grab}
.cs.sel{background:var(--sun);color:var(--on-sun);transform:translateY(-3px)}
.cs[disabled]{box-shadow:none;cursor:default;opacity:.9}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcols>div{display:grid;gap:8px;align-content:start}
.mt{padding:10px 12px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper);text-align:left;font-weight:700;font-size:.95rem}
.mt.sel{background:var(--sun);color:var(--on-sun)}
.mt.ok{background:var(--mint-bg);border-color:var(--mint)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bucket{min-height:130px;padding:8px;border:3px dashed var(--edge);border-radius:18px;background:var(--bg)}
.bucket.over{background:var(--sun)}
.bk-h{font-family:"Baloo 2",sans-serif;font-weight:800;margin-bottom:6px}
.bk-list{display:grid;gap:6px}
.bk-list .cs{font-size:.88rem;padding:5px 9px;box-shadow:none;background:var(--mint-bg)}

/* poster */
.maker{display:grid;gap:18px}
@media(min-width:800px){.maker{grid-template-columns:1fr 280px}}
.poster{aspect-ratio:4/5;border:3px solid var(--edge);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:hidden;box-shadow:0 5px 0 var(--edge);max-width:320px;width:100%;margin:0 auto}
.poster .em{font-size:4.4rem;line-height:1}
.poster .pt{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.6rem;line-height:1.1;overflow-wrap:anywhere}
.poster .pm{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.poster .by{margin-top:auto;font-size:.8rem;font-weight:800;opacity:.9}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--edge)}
.sw button[aria-pressed="true"]{outline:4px solid var(--focus);outline-offset:2px}
.stk button{font-size:1.6rem;min-width:50px;min-height:50px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper)}
.stk button[aria-pressed="true"]{background:var(--sun)}
.chk{list-style:none;margin:8px 0;padding:0}
.chk li{padding:3px 0;font-weight:700}
.chk li.ok{color:var(--mint)}
.chk li.no{color:var(--soft)}
.chk li.warn{color:var(--coral)}

/* detective */
.msg{border:2.5px solid var(--edge);border-radius:18px;background:var(--paper);padding:14px}
.msg .meta{font-size:.9rem;margin-bottom:8px}
.seg{border:0;background:none;padding:2px 1px;border-radius:6px;font:inherit;text-align:left;border-bottom:3px dotted var(--soft)}
.seg:hover{background:var(--c-bg)}
.seg.found{background:var(--coral-bg);border-bottom:3px solid var(--coral)}
.found-list{display:grid;gap:8px;margin-top:12px}
.flag{padding:8px 12px;border-radius:12px;background:var(--coral-bg);border:2px solid var(--coral)}

/* summary */
.mm{display:grid;gap:10px;margin:10px 0}
.mm-c{justify-self:center;padding:10px 22px;border:3px solid var(--edge);border-radius:99px;background:var(--st);color:var(--on-st,#fff);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.2rem}
.mm-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding-top:12px;border-top:4px dotted var(--edge)}
.mm-b div{padding:8px 12px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper);font-size:.95rem}
.kw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.myth{width:100%;text-align:left;margin:6px 0;padding:10px 14px;border:2.5px dashed var(--edge);border-radius:14px;background:var(--paper)}
.myth.open{border-style:solid;background:var(--mint-bg)}

/* result */
.ring{--p:0;width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:0 auto}
.ring div{width:132px;height:132px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2.8rem;border:2.5px solid var(--edge)}
.bar{height:16px;border:2.5px solid var(--edge);border-radius:99px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet)}
.board{width:100%;border-collapse:collapse}
.board td,.board th{padding:6px 8px;border-bottom:2px solid var(--line);text-align:left}
.cert{border:4px double var(--edge);border-radius:22px;padding:24px;text-align:center;background:var(--paper)}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{min-width:52px;min-height:48px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper);font-size:1.5rem}
.scale button[aria-pressed="true"]{background:var(--sun);box-shadow:0 3px 0 var(--edge)}

/* toast / confetti / dialogs */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{padding:8px 18px;border:2.5px solid var(--edge);border-radius:99px;background:var(--sun);color:var(--on-sun);font-weight:800;box-shadow:0 4px 0 var(--edge);animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.conf{position:fixed;top:-30px;z-index:90;font-size:1.6rem;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
dialog{border:3px solid var(--edge);border-radius:24px;background:var(--paper);color:var(--ink);padding:0;width:min(940px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(14,19,64,.6)}
.dh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--paper);border-bottom:3px solid var(--edge);z-index:2}
.dh h2{margin:0}
.db{padding:16px 18px 24px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 14px;border:2.5px solid var(--edge);border-radius:99px;background:var(--paper);font-weight:800;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--sun);color:var(--on-sun)}
.tw{overflow-x:auto;margin:8px 0 16px}
table.t{border-collapse:collapse;min-width:560px;width:100%;font-size:.93rem}

{id:"D",col:"d",icon:"🕵️",title:"Melindungi Data Pribadi dari Phishing",sub:"Jadi detektif pesan palsu",tp:"TP 5",dpl:["Penalaran Kritis","Kemandirian","Kewargaan"],

 {id:"D.explore",name:"Kenali",type:"hot",say:"Kenali dulu musuhnya. Tekan setiap kartu!",

  items:[
  {id:"ph",icon:"🎣",name:"Apa itu phishing?",title:"Phishing: memancing korban",body:"Kata phishing berasal dari “fishing” (memancing). Penipu memasang “umpan” berupa pesan, tautan, atau situs palsu supaya kamu memberikan data pribadi.",analogy:"Seperti pemancing yang memberi umpan lezat agar ikan menggigit.",example:"Bisa lewat SMS, WhatsApp, email, media sosial, bahkan game."},
  {id:"dp",icon:"🔑",name:"Data pribadi",title:"Data pribadi: kunci rumah digitalmu",body:"Data pribadi adalah informasi tentang dirimu yang bisa dipakai untuk mengenali atau menemukan dirimu: kata sandi, alamat rumah, nomor HP, tanggal lahir, dan kode OTP.",analogy:"Seperti kunci rumah: tidak boleh diberikan kepada sembarang orang.",example:"Tanyakan orang dewasa dulu sebelum membagikan nama lengkap, foto wajah, atau nama sekolahmu."},

 {id:"D.sort",name:"Pilah Data",type:"sort",say:"Mana data yang harus dirahasiakan, mana yang boleh dibagikan dengan bijak?",

  qs:[

 {id:"D.sum",name:"Rangkuman",type:"sum",say:"Kamu sudah jadi detektif! Ingat tiga langkah perisai.",

<h3>Gamifikasi</h3><p>Poin XP, 5 level (Paket Mungil sampai Warga Digital Bijak), 8 lencana, misi per stasiun, papan skor perangkat, dan sertifikat. Reward visual berupa konfeti dan kartu lencana.</p>`,

<h3>Spesifikasi visual</h3>
<ul><li><b>Palet:</b> indigo tua #1B2160 (teks dan garis), kuning #FFC22E (aksi), biru, ungu, kuning, merah muda, hijau sebagai warna stasiun.</li><li><b>Huruf:</b> Baloo 2 (judul), Nunito (isi), dengan font cadangan sistem.</li><li><b>Gaya:</b> kartu bergaris tebal bergaya stiker dengan bayangan keras; titik-titik jaringan di latar.</li><li><b>Maskot:</b> Piko, paket data berantena (SVG).</li><li><b>Aset:</b> semua ikon berupa emoji dan SVG, tanpa berkas gambar, sehingga ringan dan mudah dibawa.</li></ul>

function openTeacher(){
  const T=teacherHTML(),names=Object.keys(T); const body=$("#teacherBody");
  const panel=h("div"); const tabs=h("div",{class:"tabs",role:"tablist"});
  function show(n){ tabs.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.n===n))); panel.innerHTML=T[n];
    const u=panel.querySelector("#tUnlock"); if(u)u.onclick=()=>{S.unlock=true;save();toast("Misi Akhir dibuka 🔓");};
    const bd=panel.querySelector("#tBoard"); if(bd)bd.onclick=()=>{LS.del(BOARD);toast("Papan skor dihapus");};
    const rs=panel.querySelector("#tReset"); if(rs)rs.onclick=()=>{ if(confirm("Reset seluruh progres di perangkat ini?")){resetAll();$("#dlgTeacher").close();setView("welcome");} }; }
  names.forEach(n=>tabs.append(h("button",{class:"tab",type:"button",role:"tab","data-n":n,onclick:()=>show(n)},n)));
  body.replaceChildren(tabs,panel); show(names[0]); $("#dlgTeacher").showModal();
}

/* ============ init ============ */
document.querySelectorAll("dialog").forEach(d=>{d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-close]"))d.close();});});
$("#homeBtn").onclick=()=>setView("welcome");
$("#btnDict").onclick=()=>{drawDict("");$("#dictQ").value="";$("#dlgDict").showModal();};
$("#dictQ").addEventListener("input",e=>drawDict(e.target.value));
$("#btnBig").onclick=e=>{const on=document.documentElement.classList.toggle("big");e.currentTarget.setAttribute("aria-pressed",String(on));};
$("#btnTeacher").onclick=openTeacher;
refreshBar();
setView("welcome");
})();
